name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------ #
  # Backend — Python tests (all LLM/API calls mocked, no real keys used)
  # ------------------------------------------------------------------ #
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt lxml_html_clean pytest-asyncio

      - name: Run tests (mocked — no real API calls)
        env:
          # Dummy values so imports succeed; real calls are mocked in tests
          GROQ_API_KEY: "test_groq_key_ci"
          TAVILY_API_KEY: "test_tavily_key_ci"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------------ #
  # Frontend — build validation
  # ------------------------------------------------------------------ #
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: "https://your-backend.onrender.com"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
