name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------ #
  # Backend — Python tests (all LLM/API calls mocked, no real keys used)
  # ------------------------------------------------------------------ #
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt lxml_html_clean pytest-asyncio

      - name: Security audit (pip-audit)
        run: pip install pip-audit && pip-audit --ignore-vuln GHSA-r9hx-vwmv-q579
        continue-on-error: true   # warn but don't block on advisory-only findings

      - name: Run tests (mocked — no real API calls)
        env:
          GROQ_API_KEY: "test_groq_key_ci"
          TAVILY_API_KEY: "test_tavily_key_ci"
          ALLOWED_ORIGINS: "http://localhost:5173"
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------------ #
  # Frontend — build validation + security audit
  # ------------------------------------------------------------------ #
  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but don't block on moderate findings

      - name: Build frontend
        env:
          VITE_API_URL: "https://multi-agent-research-assistant-2exr.onrender.com/"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ------------------------------------------------------------------ #
  # Deploy Backend → Render  (only on push to main, after tests pass)
  # ------------------------------------------------------------------ #
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [backend-tests]          # gates on tests passing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy webhook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
        # Set RENDER_BACKEND_DEPLOY_HOOK in:
        # GitHub repo → Settings → Secrets → Actions
        # Get the URL from: Render dashboard → your service → Settings → Deploy Hook


# ------------------------------------------------------------------ #
  # Deploy Frontend → Vercel  (only on push to main, after build passes)
  # ------------------------------------------------------------------ #
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: [frontend-build]         # gates on build passing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install frontend dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN